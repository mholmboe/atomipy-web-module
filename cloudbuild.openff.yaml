# Cloud Build pipeline for the OpenFF small-molecule worker (separate service).
#
# The worker rarely changes, so give it its own trigger (e.g. only on changes to
# docker/Dockerfile.openff, envs/atomipy-openff.yml, or workers/**) or deploy it
# manually with:
#   gcloud builds submit --config cloudbuild.openff.yaml
#
# After the first deploy, point the main service at it:
#   gcloud run services update atomipy-web-module --region=europe-north1 \
#       --update-env-vars=OPENFF_WORKER_URL=https://<worker-url>

substitutions:
  _REGION: europe-north1
  _SERVICE: atomipy-openff-worker
  _REPO: atomipy
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

images:
  - ${_IMAGE}:${SHORT_SHA}
  - ${_IMAGE}:latest

steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -f
      - docker/Dockerfile.openff
      - -t
      - ${_IMAGE}:${SHORT_SHA}
      - -t
      - ${_IMAGE}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    id: push
    args: [push, --all-tags, ${_IMAGE}]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      # The worker is internal-only; the main app calls it. Keep it private and
      # grant the main service's identity run.invoker, OR use --allow-unauthenticated
      # for simplicity if you prefer (less secure).
      - --no-allow-unauthenticated
      - --memory=4Gi
      - --cpu=2
      - --timeout=600
      - --min-instances=0
      - --max-instances=2
      - --update-env-vars=INTERCHANGE_EXPERIMENTAL=1

timeout: 2400s
