# Manual deploy for the OpenFF small-molecule worker.
#
# The worker (service: atomipywebmodule-openff-worker) already runs and rarely
# changes; it has no auto-trigger. Rebuild/redeploy it manually when its env or
# Dockerfile changes:
#   gcloud builds submit --config cloudbuild.openff.yaml
#
# The main service already points at it via OPENFF_WORKER_URL.

substitutions:
  _REGION: europe-north1
  _SERVICE: atomipywebmodule-openff-worker  # existing worker service name
  _REPO: cloud-run-source-deploy            # existing Artifact Registry repo
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true   # expand ${_IMAGE} which nests ${_REPO} etc.

images:
  - ${_IMAGE}:${BUILD_ID}
  - ${_IMAGE}:latest

steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -f
      - docker/Dockerfile.openff
      - -t
      - ${_IMAGE}:${BUILD_ID}
      - -t
      - ${_IMAGE}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - --all-tags
      - ${_IMAGE}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${BUILD_ID}
      - --region=${_REGION}
      - --platform=managed
      # The main app currently calls the worker over plain HTTP (no auth token),
      # so the worker must stay public. Hardening TODO: have the main service send
      # an ID token and switch this to --no-allow-unauthenticated.
      - --allow-unauthenticated
      - --memory=4Gi
      - --cpu=2
      - --timeout=600
      - --min-instances=0
      - --max-instances=2
      - --update-env-vars=INTERCHANGE_EXPERIMENTAL=1

timeout: 2400s
