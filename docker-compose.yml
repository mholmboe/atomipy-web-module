# Local "production-like" run of the unified app.
#
#   docker compose up --build
#   open http://localhost:8080
#
# The `app` service is the same image deployed to Cloud Run: FastAPI serving the
# built frontend + API. `openff-worker` is the optional small-molecule service
# (needed only for the Organic Molecule node).
#
# For day-to-day development with hot reload, use ./restart_dev.sh instead
# (Vite dev server + backend + worker, no Docker).
version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports: ["8080:8080"]
    environment:
      PORT: "8080"
      # CPU simulations (energy minimization / short runs) are enabled, matching
      # the public site. The image ships no OpenCL driver, so OpenMM uses the
      # native CPU platform. Set to "true" to disable simulations.
      DISABLE_SIMULATION: "false"
      OPENFF_WORKER_URL: "http://openff-worker:8001"
    depends_on: [openff-worker]

  openff-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.openff
    environment:
      PORT: "8001"
      INTERCHANGE_EXPERIMENTAL: "1"
    expose: ["8001"]
