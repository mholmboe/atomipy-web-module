# Cloud Build pipeline for the atomipy web module (main service).
#
# Wire this to a Cloud Build trigger on github.com/mholmboe/atomipy-web-module
# (branch ^main$). Each push builds the unified image (FastAPI + built frontend)
# and deploys it to Cloud Run.
#
# One-time setup (see deploy notes / README):
#   gcloud artifacts repositories create atomipy \
#       --repository-format=docker --location=${_REGION}
#   # set OPENFF_WORKER_URL once on the service after the worker is deployed.

substitutions:
  _REGION: europe-north1
  _SERVICE: atomipy-web-module
  _REPO: atomipy
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}

options:
  machineType: E2_HIGHCPU_8        # frontend build + conda env solve are heavy
  logging: CLOUD_LOGGING_ONLY

images:
  - ${_IMAGE}:${SHORT_SHA}
  - ${_IMAGE}:latest

steps:
  # --- Build ---------------------------------------------------------------
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -f
      - Dockerfile
      - -t
      - ${_IMAGE}:${SHORT_SHA}
      - -t
      - ${_IMAGE}:latest
      - .

  # --- Push ----------------------------------------------------------------
  - name: gcr.io/cloud-builders/docker
    id: push
    args: [push, --all-tags, ${_IMAGE}]

  # --- Deploy --------------------------------------------------------------
  # --update-env-vars (not --set-env-vars) so a manually-set OPENFF_WORKER_URL
  # on the service is preserved across deploys.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --memory=4Gi
      - --cpu=2
      # Long enough to stream a CPU energy-minimization / short run. The build
      # itself is capped by BUILD_TIMEOUT_SECONDS (default 600) inside the app.
      - --timeout=900
      # Sims are CPU-bound; keep concurrency modest so jobs don't starve.
      - --concurrency=4
      - --min-instances=0
      - --max-instances=4
      # DISABLE_SIMULATION=false -> CPU energy-minimization / short MD is allowed
      # online. The image ships no OpenCL driver, so OpenMM uses the native CPU
      # platform. Tighten BUILD_TIMEOUT_SECONDS / step caps later to bound cost.
      - --update-env-vars=DISABLE_SIMULATION=false,WEB_CONCURRENCY=1

timeout: 1800s
