# OPTIONAL manual / declarative deploy for the atomipy web module (main service).
#
# NOTE: the LIVE deploy path is the existing Cloud Run *source-deploy* trigger
# (rmgpgab-atomipy-web-module-...), which auto-builds the root Dockerfile and
# deploys to Cloud Run on every push to main — it does NOT use this file. Keep
# this as an Infrastructure-as-Code reference / disaster-recovery manual deploy:
#   gcloud builds submit --config cloudbuild.yaml
# To make THIS the live path instead, point the trigger's config at this file.

substitutions:
  _REGION: europe-north1
  _SERVICE: atomipy-web-module
  _REPO: cloud-run-source-deploy            # existing Artifact Registry repo
  _WORKER_URL: https://atomipywebmodule-openff-worker-dxodrlhbmq-lz.a.run.app
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}

options:
  machineType: E2_HIGHCPU_8        # frontend build + conda env solve are heavy
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true      # expand ${_IMAGE} which nests ${_REPO} etc.

images:
  - ${_IMAGE}:${BUILD_ID}
  - ${_IMAGE}:latest

steps:
  # --- Build ---------------------------------------------------------------
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -f
      - Dockerfile
      - -t
      - ${_IMAGE}:${BUILD_ID}
      - -t
      - ${_IMAGE}:latest
      - .

  # --- Push ----------------------------------------------------------------
  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - --all-tags
      - ${_IMAGE}

  # --- Deploy --------------------------------------------------------------
  # --update-env-vars (not --set-env-vars) so a manually-set OPENFF_WORKER_URL
  # on the service is preserved across deploys.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${BUILD_ID}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --memory=4Gi
      - --cpu=2
      # Long enough to stream a CPU energy-minimization / short run. The build
      # itself is capped by BUILD_TIMEOUT_SECONDS (default 600) inside the app.
      - --timeout=900
      # MUST stay 1: each build runs user scripts with a process-global
      # redirect_stdout into a per-build log; concurrent builds in one instance
      # corrupt each other's streams ("I/O operation on closed file"). Cloud Run
      # scales out to more instances instead.
      - --concurrency=1
      - --min-instances=0
      - --max-instances=10
      # SIMULATION_MODE controls policy (em_only on the public instance).
      # The image ships no OpenCL driver, so OpenMM uses the native CPU
      # platform. Tighten BUILD_TIMEOUT_SECONDS / step caps later to bound cost.
      - --update-env-vars=SIMULATION_MODE=em_only,WEB_CONCURRENCY=1,OPENFF_WORKER_URL=${_WORKER_URL}

timeout: 1800s
