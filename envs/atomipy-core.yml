name: atomipy-core
channels:
  - conda-forge
  - mosdef
dependencies:
  - python=3.11
  - pip
  - openmm>=8.1
  - numpy
  - scipy
  # atomipy runtime deps (kept in sync with requirements.txt)
  - pandas
  - matplotlib
  - tqdm
  - gemmi>=0.7.0
  - numba>=0.50.0
  - xdrfile=1.1.4           # libxdrfile: read GROMACS .xtc/.trr (atomipy.xdrfile finds it in <prefix>/lib)
  # web server / task queue
  - fastapi
  - uvicorn
  - python-multipart        # FastAPI file uploads (UploadFile/File)
  - gunicorn
  - celery
  - redis-py
  - requests
