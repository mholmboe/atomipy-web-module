name: atomipy-core
channels:
  # conda-forge only. The 'mosdef' channel was dropped: nothing here needs it (GMSO/ParmEd
  # are no longer atomipy deps), and its repodata mirror is slow/flaky — it timed out and
  # failed a Cloud Build. Every dependency below resolves from conda-forge.
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # NOTE: GROMACS is intentionally NOT here. It is added to the Cloud Run image in the
  # Dockerfile only (a CPU build), so this shared env — used by local dev (restart_dev.sh)
  # and mirrored by Colab's requirements.txt — stays free of a CPU gromacs that would
  # shadow a local/Colab GPU build. OpenMM auto-selects a GPU (CUDA/OpenCL/Metal) when
  # present, else CPU.
  - openmm>=8.1
  - numpy
  - scipy
  # atomipy runtime deps (kept in sync with requirements.txt)
  - pandas
  - matplotlib
  - tqdm
  - gemmi>=0.7.0
  - numba>=0.50.0
  - xdrfile=1.1.4           # libxdrfile: read GROMACS .xtc/.trr (atomipy.xdrfile finds it in <prefix>/lib)
  # web server / task queue
  - fastapi
  - uvicorn
  - python-multipart        # FastAPI file uploads (UploadFile/File)
  - gunicorn
  - celery
  - redis-py
  - requests
